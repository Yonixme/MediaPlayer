// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.0.21"
    ext.core_ktx_version = "1.15.0"
    ext.appcompat_version = "1.7.0"
    ext.material_version = "1.12.0"
    ext.coroutines_version = "1.7.3"
    ext.fragment_ktx_verion = "1.8.5"
    ext.constraintlayout_version = "2.2.0"
    ext.hilt_version = "2.51.1"
    ext.ksp_version = "2.0.21-1.0.26"
    ext.room_version = "2.6.1"
    ext.navigation_version = "2.8.6"
    ext.livedata_version = "2.8.7"

    ext.junit_version = "4.13.2"
    ext.ext_junit_version = "1.2.1"
    ext.espresso_core_verion = "3.6.1"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.8.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'com.google.devtools.ksp' version "$ksp_version" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter() // Warning: this repository is going to shut down soon
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}